[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pad"
version = "0.1.0"
description = "A Python CLI application"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "numpy>=1.24.0",
]
 

[project.scripts]
pad = "pad.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "pylint>=2.0",
    "mypy>=0.900",
]
